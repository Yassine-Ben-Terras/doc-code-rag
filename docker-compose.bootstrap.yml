# Only for the initial download of public model weights; never serve user data here.
services:
  inference:
    environment:
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_HUB_DISABLE_XET: "0"
      HF_XET_HIGH_PERFORMANCE: "1"
      HF_XET_CHUNK_CACHE_SIZE_BYTES: "0"
    networks: [internal, bootstrap]
networks:
  bootstrap: {}
